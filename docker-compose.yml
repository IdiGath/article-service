networks:
  blog-network:
    driver: bridge

services:
  postgres:
    image: "postgres:latest"
    container_name: "article-postgres"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PWD}
      POSTGRES_USER: postgres
      POSTGRES_DB: article
      PGDATA: /var/lib/postgresql/data/pgdata/article
    volumes:
      - ./postgres_data:/var/lib/postgresql/data/article
    restart: unless-stopped
    ports:
      - "8085:5432"
    networks:
      - blog-network
