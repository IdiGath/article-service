quarkus.datasource.db-kind=postgresql
#${JAVA_USER_PASSWORD}
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changeLog.xml
quarkus.swagger-ui.always-include=true
quarkus.hibernate-orm.database.generation=validate
###=== DEV-Properties ===###
%dev.quarkus.datasource.username=articleservice
%dev.quarkus.datasource.password=devpwd
%dev.quarkus.liquibase.username=containeradmin
%dev.quarkus.liquibase.password=devadminpwd
quarkus.datasource.devservices.port=8085
quarkus.datasource.devservices.db-name=article
quarkus.datasource.devservices.image-name=postgres:18
quarkus.datasource.devservices.init-script-path=db/dev/init-dev-user.sql
###=== PROD-Properties ===###
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:8085/article
%prod.quarkus.datasource.devservices.enabled=false
%prod.quarkus.datasource.username=${DATASOURCE_USERNAME}
%prod.quarkus.datasource.password=${DATASOURCE_PASSWORD}
%prod.quarkus.liquibase.username=${LIQUIBASE_USERNAME}
%prod.quarkus.liquibase.password=${LIQUIBASE_PASSWORD}
