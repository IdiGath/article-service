quarkus.datasource.db-kind=postgresql
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changeLog.xml
quarkus.swagger-ui.always-include=true
quarkus.hibernate-orm.database.generation=validate
quarkus.http.read-timeout=5s
quarkus.http.idle-timeout=5s
quarkus.hibernate-orm.jdbc.timeout=5
quarkus.datasource.devservices.db-name=article
###=== DEV-Properties ===###
%dev.quarkus.datasource.username=articleservice
%dev.quarkus.liquibase.username=containeradmin
%dev.quarkus.datasource.password=${DEV_ARTICLE_SERVICE_USER_PWD}
%dev.quarkus.liquibase.password=${DEV_LIQUIBASE_USER_PWD}
%dev.quarkus.datasource.devservices.port=8085
quarkus.datasource.devservices.image-name=postgres:18
quarkus.datasource.devservices.init-script-path=db/dev/target/init-dev-user.sql
###=== PROD-Properties ===###
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:8085/article
%prod.quarkus.datasource.devservices.enabled=false
%prod.quarkus.datasource.password=${PROD_ARTICLE_SERVICE_USER_PWD}
%prod.quarkus.liquibase.password=${PROD_LIQUIBASE_USER_PASSWORD}
